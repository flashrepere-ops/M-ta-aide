*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:#040614
}

body{
  font-family:ui-rounded,"Trebuchet MS",system-ui,-apple-system,Segoe UI,sans-serif;
  color:#fff
}

button{
  cursor:pointer
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(-2deg)
  }

  50%{
    transform:translateY(-10px) rotate(2deg)
  }
}

@keyframes pop{
  from{
    transform:scale(.92);
    opacity:0
  }

  to{
    transform:scale(1);
    opacity:1
  }
}

@keyframes confettiFall{
  0%{
    transform:translateY(-20px) rotate(0deg);
    opacity:1
  }

  100%{
    transform:translateY(430px) rotate(720deg);
    opacity:.1
  }
}

@keyframes shimmer{
  from{
    background-position:0% 0
  }

  to{
    background-position:200% 0
  }
}

@keyframes pulseGold{
  0%,100%{
    box-shadow:0 0 0 0 rgba(245,197,24,.45)
  }

  50%{
    box-shadow:0 0 0 12px rgba(245,197,24,0)
  }
}

@keyframes firework{
  0%{
    transform:scale(.2);
    opacity:1
  }

  100%{
    transform:scale(1.8);
    opacity:0
  }
}

.animate-floaty{
  animation:floaty 3.2s ease-in-out infinite
}

.animate-pop{
  animation:pop .35s ease both
}

.confetti{
  animation:confettiFall 2.4s ease-in infinite
}

.firework{
  animation:firework 1.1s ease-out infinite
}

.shimmer{
  background:linear-gradient(100deg,#F5C518 20%,#fff6a8 45%,#F5C518 70%);
  background-size:200% 100%;
  animation:shimmer 2s linear infinite
}

.pulse-gold{
  animation:pulseGold 1.8s infinite
}

input,select{
  outline:none
}

input:focus,select:focus{
  border-color:#F5C518!important;
  box-shadow:0 0 0 3px rgba(245,197,24,.18)
}

,"Mali"),Niger:b("XOF","F CFA",500,[500,1000,2000,5000,1e4,20000],"Niger"),"Guinée-Bissau":b("XOF","F CFA",500,[500,1000,2000,5000,1e4,20000],"Guinée-Bissau"),Cameroun:ay,Tchad:b("XAF","F CFA",500,[500,1000,2000,5000,1e4,20000],"Tchad"),Congo:b("XAF","F CFA",500,[500,1000,2000,5000,1e4,20000],"Congo"),Gabon:b("XAF","F CFA",500,[500,1000,2000,5000,1e4,20000],"Gabon"),"Guinée Équatoriale":b("XAF","F CFA",500,[500,1000,2000,5000,1e4,20000],"Guinée Équatoriale"),RCA:b("XAF","F CFA",500,[500,1000,2000,5000,1e4,20000],"RCA"),Ghana:b("GHS","GH₵",13,[13,25,50,125,250,500],"Ghana"),Nigeria:b("NGN","₦",1250,[1250,2500,5000,12500,25000,50000],"Nigeria"),Liberia:b("LRD","L$",160,[160,320,640,1600,3200,6400],"Liberia"),"Sierra Leone":b("SLE","Le",20,[20,40,80,200,400,800],"Sierra Leone"),Gambia:b("GMD","D",60,[60,120,240,600,1200,2400],"Gambia"),Gambie:b("GMD","D",60,[60,120,240,600,1200,2400],"Gambie"),"Guinée":b("GNF","FG",7500,[7500,15000,30000,75000,150000,300000],"Guinée"),Mauritanie:b("MRU","UM",35,[35,70,140,350,700,1400],"Mauritanie")};var H0={BAC:["C","D","A4","G2","E"],Probatoire:["C","D","A4","G2"],BEPC:["Général"],BFEM:["Général"],DEF:["Général"]},dy={WASSCE:["Science","Arts","Business"],WAEC:["Science","Arts","Business"],NECO:["Science","Arts","Business"],JAMB:["Science","Arts","Business"],BECE:["General"],GABECE:["General"]},ha=[{id:1,subject:"Maths",chapter:"Limites de fonction",level:"Maths • Fiche 1",time:"15 min",pct:72,formula:"lim 1/x = 0  •  lim eˣ = +∞  •  lim ln x / xⁿ = 0",method:"Repère d’abord qui domine en +∞ : eˣ domine toute puissance, et toute puissance domine ln x.",detail:"Les limites usuelles et les croissances comparées : les réflexes pour lever les formes indéterminées.",points:["(1) Limites usuelles : lim 1/x = 0 (x → +∞), lim xⁿ = +∞ (n > 0).","(2) Exponentielle / logarithme : lim eˣ = +∞ (x → +∞), lim eˣ = 0 (x → −∞), lim ln x = +∞ (x → +∞), lim ln x = −∞ (x → 0⁺).","(3) Croissances comparées en +∞ : lim ln x / xⁿ = 0, lim xⁿ / eˣ = 0 (n > 0).","(4) Croissances comparées : lim xⁿ eˣ = 0 (x → −∞), lim xⁿ ln x = 0 (x → 0⁺) (n > 0).","(5) À retenir : en +∞, eˣ domine toute puissance, et toute puissance domine ln x."]},{id:2,subject:"Maths",chapter:"Probabilités",level:"Maths • Fiche 2",time:"16 min",pct:64,formula:"P(Ā) = 1 − P(A)  •  P(X = k) = C(n,k) pᵏ (1−p)ⁿ⁻ᵏ  •  E(X) = np",method:"Vérifie toujours que P(Ω) = 1 et que la somme des probabilités vaut 1.",detail:"Probabilité, probabilité conditionnelle, variable aléatoire et loi binomiale : les formules à connaître par cœur.",points:["(1) P(Ω) = 1, 0 ≤ P(A) ≤ 1 et P(Ā) = 1 − P(A).","(2) P(A ∪ B) = P(A) + P(B) − P(A ∩ B).","(3) Probabilité conditionnelle : P_B(A) = P(A|B) = P(A ∩ B) / P(B) si P(B) ≠ 0.","(4) Variable aléatoire discrète : E(X) = Σ xᵢ pᵢ, V(X) = E(X²) − [E(X)]².","(5) Loi binomiale X ~ B(n, p) : P(X = k) = C(n, k) pᵏ (1−p)ⁿ⁻ᵏ, E(X) = np, V(X) = np(1−p)."]},{id:3,subject:"Maths",chapter:"Trigonométrie — Identités + Dérivées",level:"Maths • Fiche 3",time:"14 min",pct:58,formula:"sin²(x) + cos²(x) = 1  •  (sin x)′ = cos x  •  (sin u)′ = u′ cos u",method:"Pars toujours de sin² + cos² = 1, puis dérive en pensant à la règle de la chaîne pour u.",detail:"Les identités de base et les dérivées des fonctions trigonométriques, avec la règle de la chaîne.",points:["Identités de base : sin²(x) + cos²(x) = 1, 1 + tan²(x) = 1 / cos²(x), cos(−x) = cos(x), sin(−x) = −sin(x).","Dérivées : (sin x)′ = cos x, (cos x)′ = −sin x, (tan x)′ = 1 + tan²(x).","Règle de la chaîne : (sin u)′ = u′ cos u, (cos u)′ = −u′ sin u.","À retenir : sin(−x) change de signe, cos(−x) ne change pas.","À retenir : la dérivée de tan x s’écrit aussi 1 / cos²(x)."]},{id:4,subject:"Maths",chapter:"Loi binomiale",level:"Maths • Fiche 4",time:"18 min",pct:66,formula:"X ~ B(n ; p)  •  P(X = k) = C(n,k) pᵏ (1−p)ⁿ⁻ᵏ  •  E(X) = n·p",method:"Compte d’abord les succès, puis applique la formule avec le bon k, le bon n et le bon p.",detail:"Le schéma de Bernoulli, les probabilités, les paramètres, les probabilités cumulées et un exemple complet.",points:["(1) Définition : Schéma de Bernoulli : n épreuves indépendantes, chacune avec proba p de succès (et 1−p d’échec). X = nombre de succès. On note X ~ B(n ; p).","(2) Probabilités : Pour k entier, 0 ≤ k ≤ n : P(X = k) = C(n, k) pᵏ (1−p)ⁿ⁻ᵏ. C(n, k) = n! / [k! (n−k)!].","(3) Paramètres : Espérance E(X) = n·p, Variance V(X) = n·p·(1−p), Écart-type σ(X) = √(n·p·(1−p)).","(4) Probabilités cumulées : P(X ≤ k) = P(X = 0) + … + P(X = k), P(X ≥ k) = 1 − P(X ≤ k−1), P(a ≤ X ≤ b) = Σ P(X = i) de i = a à b.","(5) Exemple : On lance 5 fois une pièce équilibrée : X = nombre de piles, X ~ B(5 ; 0,5). P(X = 3) = C(5,3)·(0,5)³·(0,5)² = C(5,3)·(0,5)⁵ = 10/32 ≈ 0,3125. Espérance E(X) = 5 × 0,5 = 2,5."]},{id:5,subject:"Maths",chapter:"Suites arithmétiques",level:"Maths • Fiche 5",time:"15 min",pct:69,formula:"uₙ₊₁ = uₙ + r  •  uₙ = u₀ + n·r  •  Sₙ = (n+1)(u₀ + uₙ) / 2",method:"Trouve d’abord r avec uₙ₊₁ − uₙ, puis écris le terme général avant toute somme ou limite.",detail:"Définition, terme explicite, monotonie, limites et sommes d’une suite arithmétique.",points:["(1) Définition : (uₙ) est arithmétique s’il existe un réel r tel que : uₙ₊₁ = uₙ + r. r est la raison. Pour n ≠ p : r = (uₙ − uₚ) / (n − p).","(2) Terme explicite : Si premier terme u₀ : uₙ = u₀ + n·r. Plus généralement : uₙ = uₚ + (n − p)·r.","(3) Monotonie : Si r > 0 : croissante. Si r = 0 : constante. Si r < 0 : décroissante.","(4) Limites : Si r > 0 : lim uₙ = +∞. Si r < 0 : lim uₙ = −∞. Si r = 0 : lim uₙ = u₀ (n → +∞).","(5) Sommes : Sₙ = u₀ + … + uₙ = (n+1)(u₀ + uₙ) / 2. Plus généralement de uₚ à uₘ : uₚ + … + uₘ = (m − p + 1)(uₚ + uₘ) / 2."]},{id:6,subject:"Maths",chapter:"Trigonométrie — Addition / Duplication",level:"Maths • Fiche 6",time:"16 min",pct:61,formula:"sin(a+b) = sin a cos b + cos a sin b  •  sin(2a) = 2 sin a cos a",method:"Apprends cos(a+b) et sin(a+b) par cœur : les formules de différence et de duplication en découlent.",detail:"Identités, formules d’addition, de différence, de duplication et tangente.",points:["(1) Identités : sin²x + cos²x = 1, tan x = sin x / cos x (cos x ≠ 0).","(2) Addition : cos(a + b) = cos a cos b − sin a sin b, sin(a + b) = sin a cos b + cos a sin b.","(3) Différence : cos(a − b) = cos a cos b + sin a sin b, sin(a − b) = sin a cos b − cos a sin b.","(4) Duplication : sin(2a) = 2 sin a cos a, cos(2a) = cos²a − sin²a = 2cos²a − 1 = 1 − 2sin²a.","(5) Tangente : tan(a + b) = (tan a + tan b) / (1 − tan a tan b), tan(a − b) = (tan a − tan b) / (1 + tan a tan b), tan(2a) = 2 tan a / (1 − tan²a)."]},{id:7,subject:"Maths",chapter:"Exponentielle et logarithme",level:"Maths • Fiche 7",time:"17 min",pct:63,formula:"eᵃ × eᵇ = eᵃ⁺ᵇ  •  ln(ab) = ln a + ln b  •  (eˣ)′ = eˣ  •  (ln x)′ = 1/x",method:"Transforme d’abord les produits en sommes avec ln, et les sommes d’exposants en produits avec e.",detail:"Les règles de calcul, les dérivées et les limites de l’exponentielle et du logarithme.",points:["Exponentielle : 1) eᵃ × eᵇ = e^(a+b)  2) eᵃ / eᵇ = e^(a−b)  3) e⁰ = 1  4) 1 / eᵃ = e^(−a)  5) (eᵃ)ᵐ = e^(am).","Exponentielle : 6) (eˣ)′ = eˣ  7) (eᵘ)′ = u′ eᵘ  8) lim eˣ = 0 (x → −∞)  9) lim eˣ = +∞ (x → +∞).","Logarithme : 1) ln(ab) = ln a + ln b  2) ln(a/b) = ln a − ln b  3) ln 1 = 0  4) ln(1/a) = −ln a  5) ln(aᵐ) = m ln a.","Logarithme : 6) (ln x)′ = 1/x  7) (ln u)′ = u′ / u  8) lim ln x = −∞ (x → 0⁺)  9) lim ln x = +∞ (x → +∞).","À retenir : eˣ et ln x sont réciproques ; en +∞, eˣ domine toute puissance, et toute puissance domine ln x."]},{id:8,subject:"Maths",chapter:"Dérivation",level:"Maths • Fiche 8",time:"15 min",pct:70,formula:"(u v)′ = u′ v + u v′  •  (u/v)′ = (u′v − u v′) / v²  •  (xⁿ)′ = n xⁿ⁻¹",method:"Identifie d’abord la forme : somme, produit, quotient ou composée — puis applique la bonne règle.",detail:"Les règles de dérivation et les dérivées usuelles à connaître par cœur.",points:["(1) (u + v)′ = u′ + v′, (k u)′ = k u′.","(2) (u v)′ = u′ v + u v′.","(3) (u / v)′ = (u′v − u v′) / v² (v ≠ 0).","(4) (v ∘ u)′(x) = u′(x)·v′(u(x)).","(5) Dérivées usuelles : (k)′ = 0, (x)′ = 1, (xⁿ)′ = n xⁿ⁻¹, (eˣ)′ = eˣ, (ln x)′ = 1/x."]},{id:9,subject:"Maths",chapter:"Suites géométriques",level:"Maths • Fiche 9",time:"16 min",pct:67,formula:"uₙ₊₁ = q·uₙ  •  uₙ = u₀·qⁿ  •  Sₙ = u₀·(1 − qⁿ⁺¹) / (1 − q)",method:"Trouve d’abord q avec uₙ₊₁ / uₙ, puis écris le terme général avant toute somme ou limite.",detail:"Définition, terme explicite, monotonie, limites et sommes d’une suite géométrique.",points:["(1) Définition : (uₙ) est géométrique s’il existe un réel q tel que : uₙ₊₁ = q·uₙ. q est la raison. Si uₙ ≠ 0, q = uₙ₊₁ / uₙ.","(2) Terme explicite : Si premier terme u₀ : uₙ = u₀·qⁿ. Plus généralement : uₙ = uₚ·q^(n−p).","(3) Monotonie (cas usuels) : Si u₀ > 0 et q > 1 : croissante. Si u₀ > 0 et q = 1 : constante. Si u₀ > 0 et 0 < q < 1 : décroissante.","(4) Limites : Si u₀ > 0 et q > 1 : lim uₙ = +∞. Si q = 1 : lim uₙ = u₀. Si |q| < 1 : lim uₙ = 0. Si q ≤ −1 : pas de limite en général.","(5) Sommes : Pour q ≠ 1 : uₚ + … + uₘ = uₚ·(1 − q^(m−p+1)) / (1 − q). En particulier Sₙ = u₀ + … + uₙ = u₀·(1 − q^(n+1)) / (1 − q). Si q = 1 : Sₙ = (n+1)·u₀."]},{id:10,subject:"Physique-Chimie",chapter:"Acides aminés",level:"Chimie • Fiche 1",time:"20 min",pct:62,formula:"NH₂–CHR–COOH  •  Zwitterion ⁺H₃N–CHR–COO⁻  •  Liaison peptidique –CO–NH–",method:"Repère d’abord les deux groupes : amine –NH₂ et carboxyle –COOH, puis écris la liaison peptidique entre deux acides aminés.",detail:"Chimie : la formule générale, le zwitterion, la liaison peptidique et les protéines.",points:["Formule générale : NH₂–CHR–COOH. R est la chaîne latérale qui change d’un acide aminé à l’autre.","Groupement amine –NH₂ : caractère basique. Groupement carboxyle –COOH : caractère acide.","Zwitterion : en solution, l’acide aminé porte les deux charges : ⁺H₃N–CHR–COO⁻.","Liaison peptidique : –CO–NH– formée entre le –COOH d’un acide aminé et le –NH₂ du suivant, avec élimination d’eau.","Protéines : enchaînement de nombreux acides aminés par des liaisons peptidiques.","Exemples : glycine (R = H) et alanine (R = CH₃)."]},{id:11,subject:"Physique-Chimie",chapter:"Acides carboxyliques & Esters",level:"Chimie • Fiche 2",time:"22 min",pct:58,formula:"R–COOH  •  Estérification : Acide + Alcool ⇌ Ester + Eau  •  Saponification : Ester + Soude → Savon + Alcool",method:"Estérification : lente, limitée, réversible. Hydrolyse : inverse. Saponification : totale, rapide — ne confonds pas les trois.",detail:"Chimie : acides carboxyliques, estérification, hydrolyse et saponification.",points:["Acide carboxylique : R–COOH. Exemple : l’acide éthanoïque CH₃–COOH.","Estérification : Acide + Alcool ⇌ Ester + Eau. Réaction lente, limitée, réversible.","Hydrolyse d’un ester : réaction inverse de l’estérification : Ester + Eau ⇌ Acide + Alcool.","Saponification : Ester + Soude → Savon + Alcool. Réaction totale et rapide.","À retenir : la saponification fabrique le savon ; l’estérification fabrique l’ester.","Repère : ⇌ pour une réaction limitée et réversible, → pour une réaction totale."]},{id:12,subject:"Physique-Chimie",chapter:"Solutions aqueuses & pH",level:"Chimie • Fiche 3",time:"20 min",pct:64,formula:"pH = −log[H₃O⁺]  •  [H₃O⁺] = 10^(−pH)  •  Henderson : pH = pKa + log([base]/[acide])",method:"Calcule d’abord [H₃O⁺] ou le pH, puis place la solution : acide, neutre ou basique.",detail:"Chimie : pH, couples acide/base, Ka, pKa et formule de Henderson.",points:["pH = −log[H₃O⁺] et, dans l’autre sens, [H₃O⁺] = 10^(−pH).","pH neutre = 7. Solution acide : pH < 7. Solution basique : pH > 7.","Couple acide / base : AH / A⁻. L’acide donne un proton H⁺, la base le capte.","Constante d’acidité Ka et pKa = −log Ka : plus le pKa est petit, plus l’acide est fort.","Formule de Henderson : pH = pKa + log([base]/[acide]).","À retenir : si [base] = [acide], alors pH = pKa."]},{id:13,subject:"Physique-Chimie",chapter:"Cinétique chimique",level:"Chimie • Fiche 4",time:"19 min",pct:60,formula:"v = −d[réactif]/dt  •  Temps de demi-réaction t₁/₂  •  Facteurs : temps, température, concentration, catalyseur",method:"Suis une concentration au cours du temps, puis lis la vitesse sur la pente de la courbe.",detail:"Chimie : vitesse de réaction, facteurs cinétiques et temps de demi-réaction.",points:["Vitesse de réaction : elle décrit à quelle vitesse les réactifs disparaissent et les produits apparaissent.","Vitesse volumique : v = −d[réactif]/dt. Le signe − compense la diminution de la concentration.","Facteur temps : la vitesse diminue en général au cours du temps, car les réactifs s’épuisent.","Facteur température : une température plus élevée accélère la réaction.","Facteur concentration : une concentration initiale plus élevée accélère la réaction.","Catalyseur : il accélère la réaction sans être consommé. Temps de demi-réaction t₁/₂ : durée pour que la concentration d’un réactif soit divisée par deux."]},{id:30,subject:"Physique-Chimie",chapter:"Chimie organique",level:"Chimie • Fiche 5",time:"21 min",pct:57,formula:"Alcanes CₙH₂ₙ₊₂  •  Alcènes CₙH₂ₙ  •  Alcools –OH  •  Aldéhydes –CHO  •  Cétones –CO–",method:"Compte d’abord la chaîne la plus longue, puis nomme la fonction : -ane, -ène, -ol, -al, -one.",detail:"Chimie : alcanes, alcènes, alcools, aldéhydes, cétones, nomenclature et isomérie.",points:["Alcanes : CₙH₂ₙ₊₂, liaisons simples uniquement. Exemple : méthane CH₄, éthane C₂H₆.","Alcènes : CₙH₂ₙ, une double liaison C=C. Exemple : éthène C₂H₄.","Alcools : groupe –OH. Exemple : éthanol CH₃–CH₂–OH.","Aldéhydes : groupe –CHO en bout de chaîne. Cétones : groupe –CO– à l’intérieur de la chaîne.","Nomenclature : repère la chaîne la plus longue, puis la fonction et sa position.","Isomérie : même formule brute, formules développées différentes — donc propriétés différentes."]},{id:31,subject:"Physique-Chimie",chapter:"Mécanique",level:"Physique • Fiche 6",time:"24 min",pct:62,formula:"v(t) = dx/dt  •  a(t) = dv/dt  •  ΣF = m·a  •  Ec = ½ m·v²  •  Ep = m·g·h  •  W = F·d·cos α",method:"Bilan des forces → 2ᵉ loi de Newton → équations horaires x(t), v(t), a(t), puis énergie.",detail:"Physique : mouvement rectiligne, chute libre, projectile, travail et énergie mécanique.",points:["Mouvement rectiligne : position x(t), vitesse v(t) = dx/dt, accélération a(t) = dv/dt.","2ᵉ loi de Newton : ΣF = m·a. La somme des forces donne l’accélération.","Chute libre (sans vitesse initiale) : v = g·t ; h = ½·g·t².","Projectile : trajectoire parabolique ; portée maximale à 45°.","Énergie cinétique Ec = ½·m·v² ; potentielle Ep = m·g·h ; mécanique Em = Ec + Ep.","Sans frottement, Em = constante. Travail d’une force : W = F·d·cos α."]},{id:32,subject:"Physique-Chimie",chapter:"Électricité",level:"Physique • Fiche 7",time:"22 min",pct:59,formula:"U = R·I  •  P = U·I  •  Condensateur q = C·U  •  RC : τ = R·C  •  RL : τ = L/R  •  Bobine u_L = L·di/dt",method:"Repère le circuit, écris la loi des mailles ou des nœuds, puis la charge du condensateur ou le courant dans la bobine.",detail:"Physique : loi d’Ohm, puissance, condensateur, circuits RC et RL.",points:["Loi d’Ohm : U = R·I aux bornes d’un conducteur ohmique.","Puissance : P = U·I ; énergie : E = P·t.","Condensateur : q = C·U ; énergie stockée E = ½·C·U².","Circuit RC : charge et décharge exponentielles, constante de temps τ = R·C.","Circuit RL : constante de temps τ = L/R ; la bobine s’oppose aux variations du courant.","Bobine : tension u_L = L·di/dt. En régime permanent, la bobine se comporte comme un fil."]},{id:33,subject:"Physique-Chimie",chapter:"Optique",level:"Physique • Fiche 8",time:"20 min",pct:55,formula:"1/OA′ − 1/OA = 1/f′  •  Vergence C = 1/f′  •  γ = A′B′/AB = OA′/OA",method:"Trace les rayons caractéristiques, puis applique la relation de conjugaison avec les signes.",detail:"Physique : lentille convergente, vergence, image réelle ou virtuelle et grandissement.",points:["Lentille convergente : relation de conjugaison 1/OA′ − 1/OA = 1/f′.","Vergence : C = 1/f′. Elle se mesure en dioptries (δ).","Grandissement : γ = A′B′/AB = OA′/OA. Il donne la taille et le sens de l’image.","Image réelle : elle se forme sur un écran, du côté opposé à l’objet.","Image virtuelle : elle ne se forme pas sur un écran ; on la voit en regardant à travers la lentille.","Foyer image F′ : les rayons parallèles à l’axe convergent en F′."]},{id:34,subject:"Physique-Chimie",chapter:"Physique nucléaire",level:"Physique • Fiche 9",time:"21 min",pct:54,formula:"N = N₀·e^(−λ·t)  •  Demi-vie T = ln2/λ  •  E = m·c²",method:"Écris d’abord le type de radioactivité, puis applique la loi de décroissance et la demi-vie.",detail:"Physique : radioactivité alpha, bêta−, bêta+, gamma, décroissance, fission et fusion.",points:["Radioactivité alpha : émission d’un noyau d’hélium ⁴₂He.","Radioactivité bêta− : émission d’un électron. Radioactivité bêta+ : émission d’un positon.","Rayonnement gamma : émission d’un photon très énergétique, sans changement du noyau.","Loi de décroissance : N = N₀·e^(−λ·t). N est le nombre de noyaux restants.","Demi-vie : T = ln2/λ. Après une demi-vie, il reste la moitié des noyaux.","Équivalence masse-énergie : E = m·c². Fission : un gros noyau se casse. Fusion : deux petits noyaux s’assemblent."]},{id:35,subject:"Physique-Chimie",chapter:"Ondes",level:"Physique • Fiche 10",time:"18 min",pct:51,formula:"f = 1/T  •  λ = v·T  •  Diffraction  •  Interférences",method:"Repère d’abord T ou f, puis calcule λ = v·T avant de parler de diffraction ou d’interférences.",detail:"Physique : ondes mécaniques, période, fréquence, longueur d’onde, diffraction et interférences.",points:["Onde mécanique : propagation d’une perturbation sans transport de matière.","Période T : durée d’une oscillation. Fréquence f = 1/T, en hertz (Hz).","Longueur d’onde : λ = v·T. C’est la distance parcourue par l’onde pendant une période.","Diffraction : une onde s’étale en passant par une ouverture de taille proche de λ.","Interférences : deux ondes qui se superposent peuvent se renforcer ou s’annuler.","À retenir : la diffraction révèle la nature ondulatoire ; plus l’ouverture est petite, plus l’étalement est grand."]},{id:14,subject:"SVT",chapter:"Génétique",level:"SVT • Fiche 1",time:"22 min",pct:84,formula:"ADN → ARN → protéine  •  Mitose / Méiose",method:"Repère le type de division, puis suis l’information : ADN, transcription, traduction.",detail:"De l’ADN à la protéine, mitose et méiose, lois de Mendel : comprendre comment l’information se transmet.",points:["ADN : double hélice, bases A–T et C–G ; gène = portion d’ADN.","Transcription : ADN → ARN messager. Traduction : ARN → protéine.","Code génétique : 3 bases (codon) → 1 acide aminé.","Mitose : 1 cellule → 2 cellules identiques. Méiose : 1 cellule → 4 cellules haploïdes.","Lois de Mendel : ségrégation des allèles ; échiquier de Punnett pour prévoir les croisements."]},{id:15,subject:"SVT",chapter:"Immunologie",level:"SVT • Fiche 2",time:"19 min",pct:66,formula:"Antigène → anticorps  •  Lymphocytes B et T",method:"Identifie l’antigène, puis la réponse : humorale (B) ou cellulaire (T).",detail:"Antigènes, anticorps, lymphocytes B et T, vaccination et VIH : comment le corps se défend.",points:["Antigène : élément reconnu comme étranger. Anticorps : protéine qui le neutralise.","Lymphocytes B : immunité humorale, production d’anticorps.","Lymphocytes T : immunité cellulaire, destruction des cellules infectées.","Vaccination : mémoire immunitaire, réponse plus rapide et plus forte.","VIH : attaque les lymphocytes T CD4 ; séropositivité = présence d’anticorps anti-VIH."]},{id:16,subject:"SVT",chapter:"Géologie",level:"SVT • Fiche 3",time:"17 min",pct:59,formula:"Tectonique des plaques  •  Séisme / Volcanisme",method:"Relie chaque phénomène à un mouvement de plaque : divergence, convergence, coulissage.",detail:"Tectonique des plaques, séismes, volcanisme et roches sédimentaires, avec des repères au Togo.",points:["Lithosphère découpée en plaques rigides en mouvement sur l’asthénosphère.","Divergence : dorsales, création de croûte. Convergence : subduction, collision, montagnes.","Séisme : rupture brutale, ondes sismiques, foyer et épicentre.","Volcanisme : remontée de magma ; lave, cendres, gaz.","Roches sédimentaires au Togo : dépôt, compaction, fossiles — archives des milieux anciens."]},{id:17,subject:"SVT",chapter:"Reproduction",level:"SVT • Fiche 4",time:"18 min",pct:63,formula:"Cycle ovarien  •  Fécondation  •  Régulation hormonale",method:"Place chaque hormone sur le cycle, puis explique son effet sur l’ovaire et l’utérus.",detail:"Hormones, cycle ovarien, fécondation et régulation : un système en boucle, contrôlé par le cerveau.",points:["Cycle ovarien : phase folliculaire, ovulation (≈ 14ᵉ jour), phase lutéale.","Œstrogènes : développement des follicules et de l’endomètre.","Progestérone : prépare l’utérus à la nidation.","FSH et LH (hypophyse) : commandent l’ovaire ; pic de LH → ovulation.","Fécondation : fusion spermatozoïde + ovule → zygote, puis nidation."]},{id:18,subject:"SVT",chapter:"Écologie",level:"SVT • Fiche 5",time:"16 min",pct:71,formula:"Photosynthèse : 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂",method:"Dessine la chaîne alimentaire, puis suis la matière et l’énergie de maillon en maillon.",detail:"Écosystème, chaîne alimentaire et photosynthèse : les producteurs fabriquent la matière qui nourrit tout le reste.",points:["Écosystème : milieu + êtres vivants en interaction (biotope + biocénose).","Chaîne alimentaire : producteur → consommateur primaire → secondaire → décomposeur.","Photosynthèse : 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂, grâce à la lumière et la chlorophylle.","Respiration : inverse de la photosynthèse, libère l’énergie.","Équilibre : toute rupture (pollution, déforestation) se propage dans la chaîne."]},{id:19,subject:"Français",chapter:"Dissertation",level:"Français • Fiche 1",time:"25 min",pct:41,formula:"Intro → Développement → Conclusion",method:"Une idée = un paragraphe : affirmation, exemple, analyse. Annonce le plan dès l’introduction.",detail:"Introduction : amener le sujet, poser la problématique, annoncer le plan. Développement : thèse / antithèse / synthèse. Conclusion : réponse + ouverture.",points:["Introduction : amener le sujet → reformuler → problématique → plan annoncé.","Développement : thèse, antithèse, synthèse — chaque partie en paragraphes distincts.","Chaque paragraphe : idée + exemple précis + analyse de l’exemple.","Conclusion : bilan de la réponse, sans idée nouvelle, puis ouverture.","Relis : orthographe, connecteurs (d’abord, cependant, ainsi) et longueur équilibrée."]},{id:20,subject:"Français",chapter:"Commentaire composé",level:"Français • Fiche 2",time:"22 min",pct:38,formula:"Axes de lecture  •  Figures de style",method:"Choisis 2 ou 3 axes, puis pour chaque axe : procédé → citation courte → effet.",detail:"Le commentaire suit le texte : on repère les procédés, on les analyse, on montre ce qu’ils font comprendre ou ressentir.",points:["Axes de lecture : par exemple, un portrait, une dénonciation, une émotion.","Métaphore : comparaison sans outil (« un océan de tristesse »).","Anaphore : répétition en début de phrase ou de vers pour insister.","Hyperbole : exagération pour frapper (« mille fois »).","Ne jamais citer sans analyser : chaque citation doit servir l’axe."]},{id:21,subject:"Français",chapter:"Contraction de texte",level:"Français • Fiche 3",time:"20 min",pct:44,formula:"Contraction ≈ 1/4 du texte  •  Reformulation",method:"Repère les idées essentielles, reformule-les dans tes mots, sans copier ni ajouter d’avis.",detail:"La contraction réduit le texte à environ un quart de sa longueur, en gardant l’ordre, les idées et le ton de l’auteur.",points:["Longueur : environ 1/4 du texte d’origine — compte les mots.","Reformulation : change les mots et les tournures, sans recopier de phrases.","Fidélité : mêmes idées, même ordre, même point de vue que l’auteur.","Aucun exemple inventé, aucun avis personnel, aucun « je » de l’auteur repris tel quel.","Vérifie à la fin : chaque idée essentielle est-elle conservée ?"]},{id:22,subject:"Français",chapter:"Œuvres au programme — Togo",level:"Français • Fiche 4",time:"26 min",pct:36,formula:"Auteur • Thèmes • Personnages • Citations",method:"Pour chaque œuvre : auteur, résumé en 5 lignes, 3 thèmes, 1 citation à analyser.",detail:"Trois œuvres à connaître en profondeur : l’identité et le voyage, la condition des femmes, le pouvoir et la justice.",points:["L’aventure ambiguë — Cheikh Hamidou Kane : Samba Diallo entre tradition et école occidentale.","Une si longue lettre — Mariama Bâ : Ramatoulaye, amitié, polygamie, condition des femmes.","Le Mandat — Sembène Ousmane : Ibrahima Dieng, le mandat perdu, la critique de l’administration.","Pour chaque œuvre : contexte, personnages, thèmes, passages clés.","En dissertation, un exemple précis vaut mieux qu’un résumé vague."]},{id:23,subject:"Anglais",chapter:"Essay & Comprehension",level:"Anglais • Fiche 5",time:"16 min",pct:66,formula:"Topic sentence • Evidence • Link",method:"Answer in your own words. Quote only when asked, and always explain the quote.",detail:"Reading comprehension and essay writing: understand the text, answer precisely, then build a clear essay.",points:["Read the questions first, then scan the text for the answers.","Answer in your own words — do not copy whole sentences.","Essay : introduction, 2–3 body paragraphs, conclusion.","Each paragraph : topic sentence → evidence / example → link to the question.","Linkers : however, moreover, therefore, for instance."]},{id:24,subject:"Philo",chapter:"La conscience & la liberté",level:"Philo • Fiche 6",time:"20 min",pct:37,formula:"Problématiser • Thèse • Antithèse • Synthèse",method:"Définis chaque notion avant de la discuter, puis confronte deux positions.",detail:"Conscience : se connaître et juger ses actes. Liberté : agir sans contrainte — mais jusqu’où ?",points:["Conscience : connaissance de soi, du monde et de ses actes.","Liberté : pouvoir de choisir ; elle suppose la responsabilité.","Thèse / antithèse : présente une position, puis la position opposée.","Synthèse : dépasse l’opposition par une réponse nuancée.","Définis les notions dans l’introduction : c’est la moitié du sujet."]}],cy=["2024","2023","2022","2021","2020","2019"],V0={Maths:["Fonctions, complexes & suites","Étude de fonction & probabilités","Complexes, suites & intégrales","Fonctions & probabilités","Suites, complexes & fonctions","Fonctions, probabilités & intégrales"],"Physique-Chimie":["Mécanique, RC & chimie","Chute libre, optique & dosage","Mécanique, électricité & pH","Projectile, RL & estérification","Mécanique, ondes & cinétique","Électricité, lentilles & saponification"],SVT:["Génétique, immunologie & géologie","Génétique, reproduction & écologie","Immunologie, géologie & reproduction","Génétique, immunologie & écologie","Reproduction, géologie & génétique","Immunologie, écologie & reproduction"],"Français":["Dissertation & commentaire","Contraction & dissertation","Commentaire & œuvres","Dissertation & contraction","Commentaire & dissertation","Œuvres & commentaire"],Anglais:["Reading, essay & grammar","Comprehension & essay","Reading & guided essay","Comprehension & essay","Reading, essay & grammar","Comprehension & essay"],Philo:["Conscience & liberté","Travail & vérité","Conscience & société","Liberté & devoir","Conscience & langage","Vérité & liberté"]},Z0={Maths:"Maths : toujours écrire le domaine avant les limites — c’est là que se gagnent les premiers points.","Physique-Chimie":"Physique : bilan des forces d’abord, équations ensuite. Jamais l’inverse.",SVT:"SVT : nomme chaque étape (transcription, traduction…) avant de l’expliquer.","Français":"Français : une idée = un paragraphe ; une citation = une analyse.",Anglais:"Anglais : réponds dans tes propres mots ; ne recopie jamais des phrases entières.",Philo:"Philo : définis chaque notion dans l’introduction avant de la discuter."},Q0={Maths:["1. Domaine, limites et dérivée.","2. Tableau de variation et asymptotes.","3. Conclusion et vérification des résultats."],"Physique-Chimie":["1. Bilan des forces / données du circuit.","2. Lois (Newton, Ohm, conjugaison) et calculs.","3. Vérification des unités et du sens physique."],SVT:["1. Repérer le phénomène et les acteurs.","2. Expliquer chaque étape dans l’ordre.","3. Conclure en reliant au cours."],"Français":["1. Lire le sujet et repérer les mots-clés.","2. Plan : introduction, 2–3 parties, conclusion.","3. Relire : orthographe, exemples, connecteurs."],Anglais:["1. Lire les questions, puis scanner le texte.","2. Répondre dans ses propres mots.","3. Relire grammaire et vocabulaire."],Philo:["1. Définir les notions du sujet.","2. Thèse, antithèse, synthèse.","3. Conclusion : réponse nuancée."]},Fg=cy.map((e,n)=>({year:e,items:["Maths","Physique-Chimie","SVT","Français","Anglais","Philo"].map((t)=>({s:t,title:`BAC D ${e} — ${t} • ${V0[t][n]}`,topic:V0[t][n],free:t==="Maths",method:Z0[t],steps:Q0[t]}))})),py=[{id:"maths-2023",tag:"MATHS • BAC D 2023",title:"Étude de f(x) = (x² − 1) / (x − 1)",steps:["1. Domaine : x − 1 ≠ 0, donc D = ℝ \\ {1}.","2. Simplification : x² − 1 = (x − 1)(x + 1), donc pour x ≠ 1, f(x) = x + 1.","3. Limite en 1 : lim f(x) = 2. Il y a un « trou » en x = 1, pas d’asymptote verticale.","4. Dérivée : f′(x) = 1 > 0, donc f est strictement croissante sur chaque intervalle.","5. Tableau : f croît de −∞ à 2 (sans atteindre 2), puis de 2 à +∞.","6. Courbe : droite y = x + 1 privée du point (1 ; 2)."],method:"Point de méthode : factorise toujours le numérateur avant de conclure — une forme indéterminée cache souvent une simplification."},{id:"physique-2023",tag:"PHYSIQUE • BAC D 2023",title:"Chute libre : h = ½ g t², avec g = 10 m/s²",steps:["1. Données : chute libre, vitesse initiale nulle, g = 10 m/s².","2. Formule : h = ½ g t² = ½ × 10 × t² = 5 t².","3. Pour t = 2 s : h = 5 × 4 = 20 m.","4. Pour t = 3 s : h = 5 × 9 = 45 m.","5. Vitesse : v = g t, donc v = 20 m/s à t = 2 s.","6. Vérification : la hauteur double presque quand le temps augmente — logique, car h dépend de t²."],method:"Point de méthode : en chute libre, écris toujours v = gt et h = ½gt² avant de remplacer — et vérifie les unités (m, s, m/s)."}],Y0=["2025","2024","2023","2022","2021","2020","2019","2018"],vy={...Z0,"Hist-Géo":"Hist-Géo : date + lieu + cause + conséquence pour chaque fait — puis une phrase de synthèse."},hy={...Q0,"Hist-Géo":["1. Dater et localiser chaque fait.","2. Expliquer causes et conséquences.","3. Conclure par une synthèse en une phrase."]},I0=[{id:"ilemaths",name:"ilemaths.net",title:"Bac Maths : Annales, sujets et corrigés",desc:"Annales Maths BAC Togo, Bénin, Sénégal, etc. avec corrigés gratuits.",items:["Bac Togo 2025 série D","Bac Probatoire Togo 2023 série D","Bac Togo 2022 série D","Bac Togo 2024 STIDD"],badge:"Maths • Corrigés gratuits",href:"https://www.ilemaths.net/maths-bac.php"},{id:"sujetexa",name:"sujetexa.com",title:"Collection Professeurs de Maths d’Afrique Francophone",desc:"Bac D Togo 2016–2019, Annales 2006–2021 Maths / Physique-Chimie / SVT, Collection A.T. Gérard.",items:["Bac D Togo 2016–2019","Annales 2006–2021 • Maths / Physique-Chimie / SVT","Collection A.T. Gérard"],badge:"Maths • Physique • SVT",href:"https://sujetexa.com"},{id:"touteslesepreuves",name:"touteslesepreuves.com",title:"Épreuves officielles BAC Afrique francophone en PDF",desc:"Sujets officiels classés par pays, année et matière, en PDF.",items:["BAC Afrique francophone","Classement par année et matière","Sujets PDF"],badge:"Toutes matières • PDF",href:"https://touteslesepreuves.com"},{id:"fomesoutra",name:"fomesoutra.com / LE GENIE / MATHIEM TI S",title:"Annales corrigées BAC Togo Série D 2008–2021",desc:"Maths, SVT, Physique — collections d’annales corrigées du Togo.",items:["BAC Togo Série D 2008–2021","Maths • SVT • Physique","Annales corrigées"],badge:"Togo • Corrigés",href:""},{id:"grandprof",name:"grandprof.net / examenscorriges.com",title:"Sujets BAC Togo par année et matière",desc:"Sujets clas
